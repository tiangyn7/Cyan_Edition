<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyan Edition</title>

    <!-- 主题初始化脚本：在页面渲染前执行，避免深色模式闪烁 -->
    <script>
        (function () {
            // 从 localStorage 读取用户保存的主题偏好，若为 'dark' 则立即添加 dark 类
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <!-- Vue3 运行时（CDN 引入，无需工程化构建） -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Tailwind CSS 配置：深色模式使用 class 策略 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 代码高亮库：主题样式 + 核心脚本 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body
    class="antialiased overflow-hidden bg-gray-50 text-zinc-800 dark:bg-[#0e0e10] dark:text-zinc-300 transition-colors duration-500">

    <!-- Vue3 挂载点 -->
    <div id="app" class="flex h-screen w-full">

        <!-- ==================== 侧边栏 ==================== -->
        <!-- 宽度通过 Vue 响应式变量控制：展开 18rem，收起 5rem -->
        <aside :style="{ width: isSidebarOpen ? '18rem' : '5rem' }"
            class="sidebar-transition flex flex-col bg-white dark:bg-[#161618] border-r border-gray-200 dark:border-white/5 relative z-30 shadow-2xl overflow-hidden transition-colors duration-500">

            <!-- 顶部：菜单按钮 + 系统标题 -->
            <div class="h-20 flex items-center shrink-0">
                <div class="w-20 flex justify-center shrink-0">
                    <!-- 侧边栏折叠/展开按钮 -->
                    <button @click="isSidebarOpen = !isSidebarOpen"
                        class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-zinc-500 transition-colors">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                </div>
                <!-- 侧边栏展开时显示系统名称，收起时隐藏（带过渡动画） -->
                <transition name="sidebar-fade">
                    <span v-if="isSidebarOpen"
                        class="text-[11px] font-black tracking-[0.3em] uppercase text-zinc-600 dark:text-zinc-400 whitespace-nowrap">Cyan
                        Edition</span>
                </transition>
            </div>

            <!-- 新建对话按钮 -->
            <div class="px-4 mb-6 shrink-0">
                <button @click="startNewChat"
                    class="h-12 flex items-center bg-transparent hover:bg-gray-100 dark:hover:bg-[#27272a] text-zinc-800 dark:text-zinc-100 rounded-2xl border border-transparent hover:border-gray-200 dark:hover:border-white/5 transition-all overflow-hidden"
                    :class="[isSidebarOpen ? 'w-full' : 'w-12 mx-auto justify-center']">
                    <div class="w-12 h-12 flex justify-center items-center shrink-0"><i class="fas fa-plus text-sm"></i>
                    </div>
                    <transition name="sidebar-fade">
                        <span v-if="isSidebarOpen"
                            class="text-xs font-bold tracking-wide whitespace-nowrap pr-6 dark:text-zinc-200">新建对话</span>
                    </transition>
                </button>
            </div>

            <!-- 会话列表：从后端获取，v-for 渲染，当前选中项高亮 -->
            <nav class="flex-1 overflow-y-auto no-scrollbar space-y-3 px-4">
                <div v-for="conv in conversations" :key="conv.id" @click="loadConversation(conv.id)"
                    class="group cursor-pointer">
                    <div class="h-12 flex items-center rounded-xl transition-all overflow-hidden" :class="[isSidebarOpen ? 'w-full' : 'w-12 mx-auto justify-center', 
                                 currentConvId === conv.id ? 'bg-gray-100 dark:bg-[#27272a] text-zinc-900 dark:text-white border border-gray-200 dark:border-white/5 shadow-sm dark:shadow-lg' : 
                                 'text-zinc-500 hover:bg-gray-50 dark:hover:bg-[#27272a]/50']">
                        <div class="w-12 h-12 flex justify-center items-center shrink-0"><i
                                class="far fa-comment-dots text-[14px]"></i></div>
                        <transition name="sidebar-fade">
                            <div v-if="isSidebarOpen" class="flex-1 flex justify-between items-center min-w-0 pr-4">
                                <!-- 会话标题，超长截断显示省略号 -->
                                <span class="text-[11px] font-medium truncate">{{ conv.title || '新对话' }}</span>
                                <!-- 删除按钮：悬停时显示，使用 .stop 阻止事件冒泡（避免同时触发切换会话） -->
                                <button @click.stop="openDeleteModal(conv.id)"
                                    class="opacity-0 group-hover:opacity-100 text-zinc-400 dark:text-zinc-500 hover:text-red-500"><i
                                        class="far fa-trash-alt text-[10px]"></i></button>
                            </div>
                        </transition>
                    </div>
                </div>
            </nav>

            <!-- 侧边栏底部：温度调节 + 主题切换 + 用户信息 -->
            <div class="p-4 border-t border-gray-200 dark:border-white/5 shrink-0 bg-gray-50/50 dark:bg-zinc-900/10">

                <!-- 温度参数调节滑块（**核心特色功能**） -->
                <div class="mb-4">
                    <!-- 侧边栏展开时显示完整滑块，收起时仅显示温度图标按钮 -->
                    <div v-if="isSidebarOpen" class="px-2">
                        <div
                            class="flex justify-between items-center mb-3 text-[10px] font-bold text-zinc-500 uppercase">
                            当前模型温度 <span
                                class="text-cyan-600 dark:text-cyan-400 bg-cyan-100 dark:bg-cyan-400/10 px-2 rounded shadow-inner">{{
                                temperature }}</span>
                        </div>
                        <!-- 温度滑块：0.0-2.0，步长 0.1，通过 v-model 双向绑定到 temperature 变量 -->
                        <input type="range" v-model="temperature" min="0" max="2" step="0.1"
                            class="w-full h-1 bg-gray-300 dark:bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-cyan-600">
                        <!-- 滑块两极标注：严谨 ↔ 发散 -->
                        <div class="flex justify-between mt-2 text-[8px] text-zinc-400 dark:text-zinc-600 uppercase">
                            <span>严谨</span><span>发散</span>
                        </div>
                    </div>
                    <div v-else class="flex justify-center">
                        <button @click="expandSidebar"
                            class="w-10 h-10 rounded-xl flex items-center justify-center bg-transparent hover:bg-gray-200 dark:hover:bg-white/5 text-zinc-500 dark:text-zinc-400 transition-all"
                            title="展开侧边栏调节温度">
                            <i class="fas fa-thermometer-half text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- 深色/浅色主题切换按钮 -->
                <button @click="toggleTheme"
                    class="flex items-center h-10 w-full rounded-xl hover:bg-gray-200 dark:hover:bg-white/5 transition-all overflow-hidden"
                    :class="isSidebarOpen ? 'px-4' : 'justify-center'">
                    <div class="w-6 flex justify-center shrink-0">
                        <!-- 图标旋转切换动画 -->
                        <transition name="theme-spin" mode="out-in">
                            <i :key="isDarkMode ? 'moon' : 'sun'"
                                :class="isDarkMode ? 'fas fa-moon text-indigo-400' : 'fas fa-sun text-amber-500'"></i>
                        </transition>
                    </div>
                    <transition name="sidebar-fade">
                        <span v-if="isSidebarOpen"
                            class="ml-4 text-[10px] font-bold text-zinc-600 dark:text-zinc-400 uppercase tracking-widest whitespace-nowrap">
                            {{ isDarkMode ? '深色模式' : '浅色模式' }}
                        </span>
                    </transition>
                </button>

                <!-- 用户信息展示 -->
                <div class="mt-3 flex items-center h-14 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 transition-all cursor-pointer overflow-hidden"
                    :class="isSidebarOpen ? 'w-full' : 'w-12 mx-auto justify-center'">
                    <div class="w-12 h-12 flex justify-center items-center shrink-0">
                        <div
                            class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-[10px] font-bold text-white shadow-lg">
                            C</div>
                    </div>
                    <transition name="sidebar-fade">
                        <div v-if="isSidebarOpen" class="ml-5 overflow-hidden">
                            <p class="text-[10px] font-bold text-zinc-800 dark:text-zinc-200 truncate">Cyan</p>
                            <p class="text-[8px] text-zinc-500 dark:text-zinc-500 uppercase tracking-tighter">Pro
                                Developer</p>
                        </div>
                    </transition>
                </div>
            </div>
        </aside>

        <!-- ==================== 主内容区 ==================== -->
        <main class="flex-1 flex flex-col relative overflow-hidden">

            <!-- 顶部导航栏：状态指示 + 模型选择 -->
            <header
                class="h-20 flex items-center justify-between px-10 z-50 absolute top-0 w-full bg-white/80 dark:bg-[#0e0e10]/80 backdrop-blur-xl border-b border-gray-200 dark:border-white/5 transition-colors duration-500">

                <!-- 左侧：在线状态指示 -->
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-zinc-400 dark:bg-zinc-600 rounded-full animate-pulse"></div>
                    <span
                        class="text-[10px] font-bold tracking-[0.2em] text-zinc-500 dark:text-zinc-400 uppercase">Engine
                        Node</span>
                </div>

                <!-- 右侧：模型切换下拉菜单 -->
                <div class="relative">
                    <!-- 当前选中模型显示按钮 -->
                    <button @click="isModelMenuOpen = !isModelMenuOpen"
                        class="flex items-center gap-4 px-6 py-2.5 bg-gray-100 dark:bg-[#161618] border border-gray-200 dark:border-white/10 rounded-full hover:border-gray-300 dark:hover:border-zinc-700 active:scale-95 transition-all text-[10px] font-black uppercase tracking-widest text-zinc-700 dark:text-zinc-200 shadow-sm dark:shadow-xl">
                        当前模型：{{ selectedModel.shortName }}
                    </button>

                    <!-- 模型下拉菜单（带缩放淡入动画） -->
                    <transition name="zoom-fade">
                        <div v-if="isModelMenuOpen"
                            class="absolute right-0 mt-3 w-64 bg-white dark:bg-[#1c1c1f] border border-gray-200 dark:border-white/10 rounded-2xl shadow-xl dark:shadow-2xl py-2 z-50 overflow-hidden backdrop-blur-2xl">
                            <!-- 遍历模型列表，当前选中项高亮并显示对钩图标 -->
                            <div v-for="m in models" :key="m.id" @click="selectModel(m)"
                                :class="[selectedModel.id === m.id ? 'bg-gray-100 dark:bg-white/5 text-zinc-900 dark:text-white' : 'text-zinc-500 hover:bg-gray-50 dark:hover:bg-white/[0.02] hover:text-zinc-800 dark:hover:text-zinc-200']"
                                class="px-6 py-4 cursor-pointer transition-all flex justify-between items-center group/item">
                                <div class="flex flex-col gap-0.5">
                                    <span class="text-[10px] font-black uppercase tracking-widest">{{ m.name }}</span>
                                    <span
                                        class="text-[8px] text-zinc-400 dark:text-zinc-600 uppercase tracking-tight">base
                                        node</span>
                                </div>
                                <i v-if="selectedModel.id === m.id" class="fas fa-check text-[8px] text-blue-500"></i>
                            </div>
                        </div>
                    </transition>
                </div>
            </header>

            <!-- 对话消息流区域 -->
            <div id="chat-flow"
                class="flex-1 overflow-y-auto px-6 md:px-20 no-scrollbar relative flex flex-col pt-24 pb-48">

                <!-- 欢迎界面：无对话历史时显示（带淡入下沉动画） -->
                <transition name="welcome-fade">
                    <div v-if="history.length === 0" key="welcome"
                        class="flex-1 flex flex-col items-center justify-center text-center opacity-60 dark:opacity-40">
                        <div
                            class="w-20 h-20 bg-gray-200/50 dark:bg-zinc-900/50 rounded-3xl flex items-center justify-center text-4xl font-light text-zinc-500 dark:text-zinc-700 mb-10 border border-gray-200 dark:border-white/5">
                            λ</div>
                        <h2
                            class="text-3xl font-light tracking-tight text-zinc-400 dark:text-zinc-500 mb-4 uppercase tracking-[0.2em]">
                            Capture your inspiration here...</h2>
                        <p
                            class="text-2xl font-light tracking-tight text-zinc-400 dark:text-zinc-500 mb-4 uppercase tracking-[0.2em]">
                            创造你的灵感...</p>
                    </div>
                </transition>

                <!-- 消息列表：使用 transition-group 实现气泡入场动画 -->
                <!-- 每条消息有唯一 id（msg-{index}），供滚动锚定定位 -->
                <transition-group name="message-fade">
                    <div v-for="(msg, i) in history" :key="'msg-'+i" :id="'msg-' + i"
                        class="max-w-3xl mx-auto w-full mb-12 last:mb-20 mt-10 scroll-mt-28">

                        <!-- 用户消息：右对齐，蓝色气泡 -->
                        <div v-if="msg.role === 'user'" class="flex justify-end pr-4">
                            <div
                                class="bg-blue-600 text-white dark:bg-zinc-800 dark:text-zinc-100 px-6 py-4 rounded-3xl rounded-tr-none text-sm leading-relaxed border border-transparent dark:border-white/5 shadow-lg dark:shadow-2xl">
                                {{ msg.content }}
                            </div>
                        </div>

                        <!-- AI 消息：左对齐，带 λ 头像，Markdown 渲染 -->
                        <div v-else class="flex gap-8 group relative">
                            <!-- λ 头像 -->
                            <div
                                class="w-10 h-10 rounded-2xl bg-white dark:bg-zinc-900 border border-gray-200 dark:border-white/5 flex items-center justify-center shrink-0 shadow-sm dark:shadow-md">
                                <div class="lambda-avatar-mono text-[14px]">λ</div>
                            </div>
                            <!-- 消息内容：通过 v-html 渲染 Markdown 转换后的 HTML -->
                            <div class="flex-1 min-w-0 pt-1 prose prose-zinc dark:prose-invert prose-sm max-w-none text-zinc-700 dark:text-zinc-300 leading-loose"
                                v-html="renderAIContent(msg.content)"></div>
                        </div>
                    </div>

                    <!-- 加载指示器：生成中时显示三个跳动圆点 -->
                    <div v-if="isLoading" key="loading"
                        class="max-w-3xl mx-auto w-full mb-12 flex items-center gap-8 mt-10">
                        <div
                            class="w-10 h-10 rounded-2xl bg-white dark:bg-zinc-900 border border-gray-200 dark:border-white/5 flex items-center justify-center shrink-0 animate-pulse">
                            <div class="lambda-avatar-mono text-[14px]">λ</div>
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <!-- 三个圆点依次跳动，animation-delay 错开 0.2s -->
                            <div class="w-1.5 h-1.5 bg-zinc-300 dark:bg-zinc-600 rounded-full animate-bounce"></div>
                            <div
                                class="w-1.5 h-1.5 bg-zinc-300 dark:bg-zinc-600 rounded-full animate-bounce [animation-delay:0.2s]">
                            </div>
                            <div
                                class="w-1.5 h-1.5 bg-zinc-300 dark:bg-zinc-600 rounded-full animate-bounce [animation-delay:0.4s]">
                            </div>
                        </div>
                    </div>
                </transition-group>
            </div>

            <!-- 底部输入区域：固定在页面底部，带渐变遮罩 -->
            <footer
                class="p-10 z-20 absolute bottom-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 dark:from-[#0e0e10] dark:via-[#0e0e10] to-transparent transition-colors duration-500">
                <div class="max-w-3xl mx-auto relative group">
                    <div
                        class="relative flex items-center bg-white dark:bg-[#18181b] border border-gray-200 dark:border-white/10 rounded-[2.5rem] p-2 pr-2 pl-4 shadow-xl dark:shadow-2xl focus-within:border-gray-300 dark:focus-within:border-white/20 transition-all">

                        <!-- 附件按钮（当前为预留功能） -->
                        <button
                            class="w-10 h-10 flex items-center justify-center text-zinc-400 dark:text-zinc-600 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors">
                            <i class="fas fa-paperclip text-sm"></i>
                        </button>

                        <!-- 输入框：Enter 发送，Shift+Enter 换行 -->
                        <!-- v-model 双向绑定 userInput，@keydown.enter.prevent 阻止默认换行 -->
                        <textarea v-model="userInput" @keydown.enter.prevent="send" rows="1" placeholder="说点什么吧..."
                            class="flex-1 bg-transparent py-4 px-3 outline-none text-sm text-zinc-800 dark:text-zinc-200 placeholder:text-zinc-400 dark:placeholder:text-zinc-700 resize-none no-scrollbar"></textarea>

                        <!-- 发送按钮：生成中或输入为空时禁用 -->
                        <div class="pr-2">
                            <button @click="send" :disabled="isLoading || !userInput.trim()"
                                class="send-btn-base flex items-center justify-center">
                                <i class="fas fa-arrow-up text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </footer>
        </main>

        <!-- ==================== 删除确认弹窗 ==================== -->
        <!-- 使用 teleport 效果（此处用 fixed 定位实现），背景遮罩点击可关闭 -->
        <transition name="zoom-fade">
            <div v-if="isDeleteModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center px-4">
                <!-- 半透明遮罩 -->
                <div class="absolute inset-0 bg-black/40 dark:bg-black/80 backdrop-blur-xl"
                    @click="isDeleteModalOpen = false"></div>
                <!-- 弹窗主体 -->
                <div
                    class="relative bg-white dark:bg-zinc-900 border border-gray-200 dark:border-white/10 w-full max-w-sm p-10 rounded-[3rem] shadow-2xl text-center">
                    <!-- 红色垃圾桶图标 -->
                    <div
                        class="w-16 h-16 bg-red-100 dark:bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-trash-alt text-xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-zinc-800 dark:text-zinc-100 mb-2">确认删除对话?</h3>
                    <p class="text-zinc-500 text-xs mb-8">此操作将永久抹除这段对话。</p>
                    <div class="flex gap-4">
                        <button @click="isDeleteModalOpen = false"
                            class="flex-1 py-4 bg-gray-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 dark:hover:bg-zinc-700 transition">返回</button>
                        <button @click="confirmDelete"
                            class="flex-1 py-4 bg-red-500 dark:bg-red-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-red-600 dark:hover:bg-red-700 transition">删除</button>
                    </div>
                </div>
            </div>
        </transition>
    </div>

    <!-- 引入 Vue3 组合式 API 业务逻辑 -->
    <script src="/static/app.js"></script>
</body>

</html>
